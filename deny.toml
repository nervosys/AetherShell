# Supply-chain security policy for cargo-deny (schema v2; cargo-deny >= 0.18).
# Run: cargo deny check     (advisories, licenses, bans, sources)

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
# Known, accepted advisories — all unmaintained/unsound/notice warnings on
# transitive deps with no available fix and no exploit path in our usage. Tracked
# so a *new* advisory still fails the gate.
ignore = [
    "RUSTSEC-2024-0388", # derivative  — unmaintained (transitive: keyring -> zbus)
    "RUSTSEC-2024-0384", # instant     — unmaintained (transitive: keyring -> async-io)
    "RUSTSEC-2024-0436", # paste       — unmaintained (transitive: ratatui)
    "RUSTSEC-2024-0370", # proc-macro-error — unmaintained (transitive: utoipa)
    # Removed 2026-07-29 — cargo-deny reported these as `advisory-not-detected`,
    # i.e. no crate in the tree matches them any more. Stale ignores are worse
    # than none: they read as accepted risk while silently covering nothing.
    #   RUSTSEC-2025-0119 (number_prefix), RUSTSEC-2026-0002 (lru),
    #   RUSTSEC-2026-0097 (rand)
]

[licenses]
version = 2
# Permissive licenses we accept in dependencies, plus the project's own
# AGPL-3.0-or-later (cargo-deny also checks the workspace crates).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "0BSD",
    "MPL-2.0",
    "CDLA-Permissive-2.0",  # webpki-roots — Mozilla CA-root *data* (permissive)
    "LGPL-3.0-or-later",    # ansi_colours (transitive via viuer/image); weak copyleft,
                            # compatible with the project's AGPL (source already provided)
    "AGPL-3.0",
    "AGPL-3.0-or-later",    # the project's own license
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
