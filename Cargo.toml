[workspace]
members = [".", "crates/aethershell-lsp"]

[package]
name = "aether_shell"
version = "0.1.2"
edition = "2021"
authors = ["Nervosys <contact@nervosys.ai>"]
description = "The world's first multi-agent shell with typed functional pipelines and multi-modal AI"
license = "Apache-2.0"
repository = "https://github.com/nervosys/AetherShell"
homepage = "https://github.com/nervosys/AetherShell"
documentation = "https://github.com/nervosys/AetherShell/blob/main/README.md"
keywords = ["shell", "ai", "multi-agent", "functional", "multimodal"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
rust-version = "1.75"

[features]
default = []
native = []
web = []

[lib]
name = "aether_shell"
path = "src/lib.rs"

[[bin]]
name = "ae"
path = "src/main.rs"

[[bin]]
name = "aimodel"
path = "src/bin/aimodel.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
reqwest = { version = "0.12", features = [
    "blocking",
    "json",
    "rustls-tls",
    "stream",
] }
chrono = { version = "0.4", features = ["clock", "serde"] }
walkdir = "2"
which = "6"
crossterm = "0.27"
thiserror = "1.0"
# TUI dependencies
ratatui = "0.26"
tui-input = "0.8"
# Media processing
image = { version = "0.24", features = ["jpeg", "png", "gif", "webp"] }
viuer = "0.7"                                                           # Terminal image display
rodio = { version = "0.17", features = ["mp3", "wav", "flac"] }         # Audio playback
tokio = { version = "1.0", features = ["full"] }
# Additional utility crates
uuid = { version = "1.0", features = ["v4", "serde"] }
base64 = "0.21"
mime = "0.3"
jsonschema = "0.17"                                    # For MCP schema validation
# Security dependencies
lazy_static = "1.4"
secrecy = { version = "0.8", features = ["serde"] }
keyring = "2.3"                                     # OS credential store integration
zeroize = "1.7"                                     # Memory zeroing for secrets
# Note: winapi will be added when Windows Job Object sandboxing is fully implemented
# AI API dependencies
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "4.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "6.0", features = ["axum"] }
toml = "0.8"
clap = { version = "4.0", features = ["derive"] }
futures = "0.3"
futures-util = "0.3"
tokio-stream = "0.1"
async-stream = "0.3"
rand = "0.8"
sha2 = "0.10"
url = "2.5"
urlencoding = "2.1"
async-trait = "0.1"
dirs = "5.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "mcp_performance"
harness = false

[[bench]]
name = "builtin_performance"
harness = false
