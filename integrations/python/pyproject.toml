[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aethershell"
version = "0.3.1"
description = "AetherShell - AI-powered typed shell with workflow orchestration and cloud deployment"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "nervosys", email = "contact@nervosys.ai" }]
keywords = [
    "shell",
    "ai",
    "agent",
    "pipeline",
    "llm",
    "automation",
    "workflow",
    "serverless",
    "cloud",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Interpreters",
    "Topic :: System :: Shells",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]
requires-python = ">=3.9"
dependencies = ["typing-extensions>=4.0"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "mypy>=1.0",
    "ruff>=0.1",
]
langchain = ["langchain>=0.1", "pydantic>=2.0"]
llamaindex = ["llama-index>=0.10"]
cloud = [
    "boto3>=1.28.0",            # AWS Lambda
    "azure-functions>=1.15.0",  # Azure Functions
    "functions-framework>=3.0", # GCP Functions
    "fastapi>=0.100.0",         # Knative/K8s
    "uvicorn>=0.23.0",
]
all = [
    "langchain>=0.1",
    "pydantic>=2.0",
    "llama-index>=0.10",
    "boto3>=1.28.0",
    "azure-functions>=1.15.0",
    "functions-framework>=3.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/nervosys/AetherShell"
Documentation = "https://github.com/nervosys/AetherShell/blob/master/integrations/python/README.md"
Repository = "https://github.com/nervosys/AetherShell"
Issues = "https://github.com/nervosys/AetherShell/issues"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.9"
strict = true
