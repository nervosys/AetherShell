[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "aethershell"
version = "0.2.0"
description = "AetherShell - AI-powered typed shell for Python"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "nervosys", email = "contact@nervosys.com" }]
keywords = ["shell", "ai", "agent", "pipeline", "llm", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Interpreters",
    "Topic :: System :: Shells",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["typing-extensions>=4.0"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "mypy>=1.0",
    "ruff>=0.1",
]
langchain = ["langchain>=0.1"]
llamaindex = ["llama-index>=0.10"]

[project.urls]
Homepage = "https://github.com/nervosys/AetherShell"
Documentation = "https://github.com/nervosys/AetherShell/blob/master/integrations/python/README.md"
Repository = "https://github.com/nervosys/AetherShell"
Issues = "https://github.com/nervosys/AetherShell/issues"

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.9"
strict = true
