[package]
name = "aethershell-packages-api"
version = "0.1.0"
edition = "2021"
authors = ["Nervosys <contact@nervosys.ai>"]
description = "AetherShell Package Registry API"

[dependencies]
aws_lambda_events = "0.15"
lambda_runtime = "0.13"
aws-config = "1.5"
aws-sdk-s3 = "1.58"
aws-sdk-dynamodb = "1.54"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "1"
semver = "1.0"
sha2 = "0.10"
base64 = "0.21"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
