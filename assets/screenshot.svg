<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e"/>
      <stop offset="100%" style="stop-color:#11111b"/>
    </linearGradient>
    <linearGradient id="titleBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#313244"/>
      <stop offset="100%" style="stop-color:#1e1e2e"/>
    </linearGradient>
  </defs>
  
  <!-- Terminal window shadow -->
  <rect x="25" y="25" width="860" height="560" rx="12" fill="#000" opacity="0.3"/>
  
  <!-- Terminal window -->
  <rect x="20" y="20" width="860" height="560" rx="12" fill="url(#termBg)"/>
  
  <!-- Title bar -->
  <rect x="20" y="20" width="860" height="40" rx="12" fill="url(#titleBar)"/>
  <rect x="20" y="48" width="860" height="12" fill="url(#titleBar)"/>
  
  <!-- Window controls -->
  <circle cx="48" cy="40" r="7" fill="#f38ba8"/>
  <circle cx="72" cy="40" r="7" fill="#f9e2af"/>
  <circle cx="96" cy="40" r="7" fill="#a6e3a1"/>
  
  <!-- Title -->
  <text x="450" y="46" font-family="'SF Pro', 'Segoe UI', sans-serif" font-size="14" fill="#cdd6f4" text-anchor="middle">Æther Shell — ae --tui</text>
  
  <!-- Terminal content -->
  <g font-family="'JetBrains Mono', 'Fira Code', 'Consolas', monospace" font-size="14">
    
    <!-- Line 1: Welcome banner -->
    <text x="40" y="90" fill="#cba6f7">╭──────────────────────────────────────────────────────────────────────╮</text>
    <text x="40" y="110" fill="#cba6f7">│</text>
    <text x="80" y="110" fill="#f5c2e7">█████╗ ███████╗████████╗██╗  ██╗███████╗██████╗</text>
    <text x="820" y="110" fill="#cba6f7">│</text>
    
    <text x="40" y="130" fill="#cba6f7">│</text>
    <text x="80" y="130" fill="#f5c2e7">██╔══██╗██╔════╝╚══██╔══╝██║  ██║██╔════╝██╔══██╗</text>
    <text x="820" y="130" fill="#cba6f7">│</text>
    
    <text x="40" y="150" fill="#cba6f7">│</text>
    <text x="80" y="150" fill="#f5c2e7">███████║█████╗     ██║   ███████║█████╗  ██████╔╝</text>
    <text x="820" y="150" fill="#cba6f7">│</text>
    
    <text x="40" y="170" fill="#cba6f7">│</text>
    <text x="80" y="170" fill="#f5c2e7">██╔══██║██╔══╝     ██║   ██╔══██║██╔══╝  ██╔══██╗</text>
    <text x="820" y="170" fill="#cba6f7">│</text>
    
    <text x="40" y="190" fill="#cba6f7">│</text>
    <text x="80" y="190" fill="#f5c2e7">██║  ██║███████╗   ██║   ██║  ██║███████╗██║  ██║</text>
    <text x="820" y="190" fill="#cba6f7">│</text>
    
    <text x="40" y="210" fill="#cba6f7">│</text>
    <text x="80" y="210" fill="#6c7086">╚═╝  ╚═╝╚══════╝   ╚═╝   ╚═╝  ╚═╝╚══════╝╚═╝  ╚═╝</text>
    <text x="560" y="210" fill="#89b4fa">v0.1.0</text>
    <text x="820" y="210" fill="#cba6f7">│</text>
    
    <text x="40" y="230" fill="#cba6f7">╰──────────────────────────────────────────────────────────────────────╯</text>
    
    <!-- Prompt and typed pipeline example -->
    <text x="40" y="265" fill="#89dceb">æ</text>
    <text x="60" y="265" fill="#a6adc8">❯</text>
    <text x="80" y="265" fill="#cdd6f4">[1, 2, 3, 4, 5]</text>
    <text x="210" y="265" fill="#f9e2af">|</text>
    <text x="225" y="265" fill="#89b4fa">map</text>
    <text x="260" y="265" fill="#cdd6f4">(</text>
    <text x="270" y="265" fill="#cba6f7">fn</text>
    <text x="293" y="265" fill="#cdd6f4">(x) =></text>
    <text x="360" y="265" fill="#cdd6f4">x * 2)</text>
    <text x="420" y="265" fill="#f9e2af">|</text>
    <text x="435" y="265" fill="#89b4fa">sum</text>
    <text x="472" y="265" fill="#cdd6f4">()</text>
    
    <!-- Result -->
    <text x="40" y="290" fill="#a6e3a1">Int(30)</text>
    
    <!-- AI query example -->
    <text x="40" y="325" fill="#89dceb">æ</text>
    <text x="60" y="325" fill="#a6adc8">❯</text>
    <text x="80" y="325" fill="#89b4fa">ai</text>
    <text x="100" y="325" fill="#cdd6f4">(</text>
    <text x="110" y="325" fill="#a6e3a1">"Explain quantum entanglement briefly"</text>
    <text x="445" y="325" fill="#cdd6f4">)</text>
    
    <!-- AI Response -->
    <text x="40" y="350" fill="#f5c2e7">🤖 AI:</text>
    <text x="95" y="350" fill="#cdd6f4">Quantum entanglement is when two particles become</text>
    <text x="40" y="370" fill="#cdd6f4">connected, so measuring one instantly affects the other,</text>
    <text x="40" y="390" fill="#cdd6f4">regardless of distance—like having two magic coins that</text>
    <text x="40" y="410" fill="#cdd6f4">always land on opposite sides.</text>
    
    <!-- MCP tools example -->
    <text x="40" y="445" fill="#89dceb">æ</text>
    <text x="60" y="445" fill="#a6adc8">❯</text>
    <text x="80" y="445" fill="#89b4fa">mcp_tools</text>
    <text x="165" y="445" fill="#cdd6f4">()</text>
    <text x="185" y="445" fill="#f9e2af">|</text>
    <text x="200" y="445" fill="#89b4fa">len</text>
    <text x="230" y="445" fill="#cdd6f4">()</text>
    
    <text x="40" y="470" fill="#a6e3a1">Int(130)</text>
    <text x="110" y="470" fill="#6c7086"># 130 MCP tools across 27 categories</text>
    
    <!-- Neural network example -->
    <text x="40" y="505" fill="#89dceb">æ</text>
    <text x="60" y="505" fill="#a6adc8">❯</text>
    <text x="80" y="505" fill="#cba6f7">let</text>
    <text x="110" y="505" fill="#cdd6f4">brain =</text>
    <text x="175" y="505" fill="#89b4fa">nn_create</text>
    <text x="265" y="505" fill="#cdd6f4">(</text>
    <text x="275" y="505" fill="#a6e3a1">"agent"</text>
    <text x="340" y="505" fill="#cdd6f4">, [4, 8, 2])</text>
    
    <text x="40" y="530" fill="#a6e3a1">Record({name: "agent", layers: [4, 8, 2], params: 58})</text>
    
    <!-- Blinking cursor -->
    <text x="40" y="560" fill="#89dceb">æ</text>
    <text x="60" y="560" fill="#a6adc8">❯</text>
    <rect x="80" y="545" width="10" height="18" fill="#cdd6f4">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
