<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e2e"/>
      <stop offset="100%" style="stop-color:#11111b"/>
    </linearGradient>
    <linearGradient id="titleBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#313244"/>
      <stop offset="100%" style="stop-color:#1e1e2e"/>
    </linearGradient>
  </defs>
  
  <!-- Terminal window shadow -->
  <rect x="25" y="25" width="860" height="480" rx="12" fill="#000" opacity="0.3"/>
  
  <!-- Terminal window -->
  <rect x="20" y="20" width="860" height="480" rx="12" fill="url(#termBg)"/>
  
  <!-- Title bar -->
  <rect x="20" y="20" width="860" height="40" rx="12" fill="url(#titleBar)"/>
  <rect x="20" y="48" width="860" height="12" fill="url(#titleBar)"/>
  
  <!-- Window controls -->
  <circle cx="48" cy="40" r="7" fill="#f38ba8"/>
  <circle cx="72" cy="40" r="7" fill="#f9e2af"/>
  <circle cx="96" cy="40" r="7" fill="#a6e3a1"/>
  
  <!-- Title -->
  <text x="450" y="46" font-family="'SF Pro', 'Segoe UI', sans-serif" font-size="14" fill="#cdd6f4" text-anchor="middle">Æther Shell — ae</text>
  
  <!-- Terminal content -->
  <g font-family="'JetBrains Mono', 'Fira Code', 'Consolas', monospace" font-size="14">
    
    <!-- Welcome message -->
    <text x="40" y="85" fill="#6c7086">Æther REPL — type 'exit', 'quit', or Ctrl-D to exit</text>
    
    <!-- Example 1: Typed pipeline -->
    <text x="40" y="120" fill="#89dceb">ae</text>
    <text x="62" y="120" fill="#6c7086">&gt;</text>
    <text x="80" y="120" fill="#f9e2af">[</text>
    <text x="90" y="120" fill="#fab387">1</text>
    <text x="100" y="120" fill="#cdd6f4">,</text>
    <text x="110" y="120" fill="#fab387">2</text>
    <text x="120" y="120" fill="#cdd6f4">,</text>
    <text x="130" y="120" fill="#fab387">3</text>
    <text x="140" y="120" fill="#f9e2af">]</text>
    <text x="155" y="120" fill="#cba6f7">|</text>
    <text x="170" y="120" fill="#89b4fa">map</text>
    <text x="200" y="120" fill="#cdd6f4">(</text>
    <text x="210" y="120" fill="#cba6f7">fn</text>
    <text x="230" y="120" fill="#cdd6f4">(x) =&gt; x * </text>
    <text x="310" y="120" fill="#fab387">2</text>
    <text x="320" y="120" fill="#cdd6f4">)</text>
    <text x="335" y="120" fill="#cba6f7">|</text>
    <text x="350" y="120" fill="#89b4fa">sum</text>
    <text x="380" y="120" fill="#cdd6f4">()</text>
    
    <!-- Result 1 -->
    <text x="40" y="145" fill="#a6e3a1">Int</text>
    <text x="65" y="145" fill="#cdd6f4">(</text>
    <text x="75" y="145" fill="#fab387">12</text>
    <text x="95" y="145" fill="#cdd6f4">)</text>
    
    <!-- Example 2: Record/Table -->
    <text x="40" y="180" fill="#89dceb">ae</text>
    <text x="62" y="180" fill="#6c7086">&gt;</text>
    <text x="80" y="180" fill="#f9e2af">{</text>
    <text x="90" y="180" fill="#89dceb">name</text>
    <text x="130" y="180" fill="#cdd6f4">:</text>
    <text x="140" y="180" fill="#a6e3a1">"Æther"</text>
    <text x="210" y="180" fill="#cdd6f4">,</text>
    <text x="220" y="180" fill="#89dceb">version</text>
    <text x="280" y="180" fill="#cdd6f4">:</text>
    <text x="290" y="180" fill="#a6e3a1">"0.1.1"</text>
    <text x="355" y="180" fill="#cdd6f4">,</text>
    <text x="365" y="180" fill="#89dceb">themes</text>
    <text x="420" y="180" fill="#cdd6f4">:</text>
    <text x="430" y="180" fill="#fab387">38</text>
    <text x="450" y="180" fill="#f9e2af">}</text>
    
    <!-- Result 2 -->
    <text x="40" y="205" fill="#a6e3a1">Record</text>
    <text x="95" y="205" fill="#cdd6f4">({</text>
    <text x="110" y="205" fill="#89dceb">name</text>
    <text x="145" y="205" fill="#cdd6f4">:</text>
    <text x="155" y="205" fill="#a6e3a1">"Æther"</text>
    <text x="220" y="205" fill="#cdd6f4">,</text>
    <text x="230" y="205" fill="#89dceb">version</text>
    <text x="290" y="205" fill="#cdd6f4">:</text>
    <text x="300" y="205" fill="#a6e3a1">"0.1.1"</text>
    <text x="365" y="205" fill="#cdd6f4">,</text>
    <text x="375" y="205" fill="#89dceb">themes</text>
    <text x="425" y="205" fill="#cdd6f4">:</text>
    <text x="435" y="205" fill="#fab387">38</text>
    <text x="455" y="205" fill="#cdd6f4">})</text>
    
    <!-- Example 3: MCP tools -->
    <text x="40" y="240" fill="#89dceb">ae</text>
    <text x="62" y="240" fill="#6c7086">&gt;</text>
    <text x="80" y="240" fill="#89b4fa">mcp_tools</text>
    <text x="165" y="240" fill="#cdd6f4">()</text>
    <text x="185" y="240" fill="#cba6f7">|</text>
    <text x="200" y="240" fill="#89b4fa">len</text>
    <text x="230" y="240" fill="#cdd6f4">()</text>
    
    <!-- Result 3 -->
    <text x="40" y="265" fill="#a6e3a1">Int</text>
    <text x="65" y="265" fill="#cdd6f4">(</text>
    <text x="75" y="265" fill="#fab387">130</text>
    <text x="105" y="265" fill="#cdd6f4">)</text>
    <text x="130" y="265" fill="#6c7086"># 130 MCP tools across 27 categories</text>
    
    <!-- Example 4: Themes -->
    <text x="40" y="300" fill="#89dceb">ae</text>
    <text x="62" y="300" fill="#6c7086">&gt;</text>
    <text x="80" y="300" fill="#89b4fa">themes</text>
    <text x="130" y="300" fill="#cdd6f4">()</text>
    <text x="150" y="300" fill="#cba6f7">|</text>
    <text x="165" y="300" fill="#89b4fa">first</text>
    <text x="200" y="300" fill="#cdd6f4">(</text>
    <text x="210" y="300" fill="#fab387">5</text>
    <text x="220" y="300" fill="#cdd6f4">)</text>
    
    <!-- Result 4 -->
    <text x="40" y="325" fill="#a6e3a1">Array</text>
    <text x="85" y="325" fill="#cdd6f4">([</text>
    <text x="100" y="325" fill="#a6e3a1">"catppuccin"</text>
    <text x="195" y="325" fill="#cdd6f4">,</text>
    <text x="205" y="325" fill="#a6e3a1">"catppuccin-latte"</text>
    <text x="345" y="325" fill="#cdd6f4">,</text>
    <text x="355" y="325" fill="#a6e3a1">"monokai"</text>
    <text x="430" y="325" fill="#cdd6f4">,</text>
    <text x="440" y="325" fill="#a6e3a1">"dracula"</text>
    <text x="515" y="325" fill="#cdd6f4">,</text>
    <text x="525" y="325" fill="#a6e3a1">"nord"</text>
    <text x="575" y="325" fill="#cdd6f4">])</text>
    
    <!-- Example 5: AI query -->
    <text x="40" y="360" fill="#89dceb">ae</text>
    <text x="62" y="360" fill="#6c7086">&gt;</text>
    <text x="80" y="360" fill="#89b4fa">ai</text>
    <text x="100" y="360" fill="#cdd6f4">(</text>
    <text x="110" y="360" fill="#a6e3a1">"What is 2+2?"</text>
    <text x="230" y="360" fill="#cdd6f4">)</text>
    
    <!-- Result 5 -->
    <text x="40" y="385" fill="#a6e3a1">Str</text>
    <text x="65" y="385" fill="#cdd6f4">(</text>
    <text x="75" y="385" fill="#a6e3a1">"2 + 2 equals 4."</text>
    <text x="220" y="385" fill="#cdd6f4">)</text>
    
    <!-- Example 6: Config -->
    <text x="40" y="420" fill="#89dceb">ae</text>
    <text x="62" y="420" fill="#6c7086">&gt;</text>
    <text x="80" y="420" fill="#89b4fa">config_get</text>
    <text x="175" y="420" fill="#cdd6f4">(</text>
    <text x="185" y="420" fill="#a6e3a1">"colors.theme"</text>
    <text x="305" y="420" fill="#cdd6f4">)</text>
    
    <!-- Result 6 -->
    <text x="40" y="445" fill="#a6e3a1">Str</text>
    <text x="65" y="445" fill="#cdd6f4">(</text>
    <text x="75" y="445" fill="#a6e3a1">"catppuccin"</text>
    <text x="170" y="445" fill="#cdd6f4">)</text>
    
    <!-- Blinking cursor -->
    <text x="40" y="480" fill="#89dceb">ae</text>
    <text x="62" y="480" fill="#6c7086">&gt;</text>
    <rect x="80" y="465" width="10" height="18" fill="#cdd6f4">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
