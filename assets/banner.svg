<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" fill="url(#bgGrad)" rx="16"/>
  
  <!-- Decorative grid lines -->
  <g opacity="0.1" stroke="#6366f1" stroke-width="1">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="200" y1="0" x2="200" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
  </g>
  
  <!-- Neural network decoration (left side) -->
  <g opacity="0.3">
    <circle cx="50" cy="60" r="6" fill="#8b5cf6"/>
    <circle cx="50" cy="100" r="6" fill="#8b5cf6"/>
    <circle cx="50" cy="140" r="6" fill="#8b5cf6"/>
    <circle cx="100" cy="80" r="5" fill="#a855f7"/>
    <circle cx="100" cy="120" r="5" fill="#a855f7"/>
    <line x1="50" y1="60" x2="100" y2="80" stroke="#8b5cf6" stroke-width="1.5"/>
    <line x1="50" y1="60" x2="100" y2="120" stroke="#8b5cf6" stroke-width="1.5"/>
    <line x1="50" y1="100" x2="100" y2="80" stroke="#8b5cf6" stroke-width="1.5"/>
    <line x1="50" y1="100" x2="100" y2="120" stroke="#8b5cf6" stroke-width="1.5"/>
    <line x1="50" y1="140" x2="100" y2="80" stroke="#8b5cf6" stroke-width="1.5"/>
    <line x1="50" y1="140" x2="100" y2="120" stroke="#8b5cf6" stroke-width="1.5"/>
  </g>
  
  <!-- Pipeline decoration (right side) -->
  <g opacity="0.3">
    <rect x="680" y="75" width="30" height="20" rx="3" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <path d="M 715 85 L 735 85" stroke="#22d3ee" stroke-width="2"/>
    <polygon points="735,85 728,80 728,90" fill="#22d3ee"/>
    <rect x="745" y="75" width="30" height="20" rx="3" fill="none" stroke="#22d3ee" stroke-width="2"/>
    
    <rect x="680" y="105" width="30" height="20" rx="3" fill="none" stroke="#a855f7" stroke-width="2"/>
    <path d="M 715 115 L 735 115" stroke="#a855f7" stroke-width="2"/>
    <polygon points="735,115 728,110 728,120" fill="#a855f7"/>
    <rect x="745" y="105" width="30" height="20" rx="3" fill="none" stroke="#a855f7" stroke-width="2"/>
  </g>
  
  <!-- Main æ symbol -->
  <text x="180" y="130" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-size="120" 
        font-weight="bold"
        fill="url(#textGrad)" 
        filter="url(#glow)">æ</text>
  
  <!-- Title text -->
  <text x="280" y="95" 
        font-family="'Inter', 'SF Pro', 'Segoe UI', sans-serif" 
        font-size="52" 
        font-weight="700"
        fill="#f8fafc">ther Shell</text>
  
  <!-- Tagline -->
  <text x="280" y="135" 
        font-family="'Inter', 'SF Pro', 'Segoe UI', sans-serif" 
        font-size="18" 
        fill="#94a3b8">Multi-Agent Shell with Typed Pipelines &amp; AI</text>
  
  <!-- Version badge -->
  <rect x="280" y="150" width="55" height="22" rx="11" fill="#22d3ee" opacity="0.2"/>
  <text x="307" y="166" 
        font-family="'JetBrains Mono', monospace" 
        font-size="12" 
        fill="#22d3ee"
        text-anchor="middle">v0.1.0</text>
  
  <!-- Rust badge -->
  <rect x="345" y="150" width="50" height="22" rx="11" fill="#f97316" opacity="0.2"/>
  <text x="370" y="166" 
        font-family="'JetBrains Mono', monospace" 
        font-size="12" 
        fill="#f97316"
        text-anchor="middle">Rust</text>
  
  <!-- AI badge -->
  <rect x="405" y="150" width="35" height="22" rx="11" fill="#a855f7" opacity="0.2"/>
  <text x="422" y="166" 
        font-family="'JetBrains Mono', monospace" 
        font-size="12" 
        fill="#a855f7"
        text-anchor="middle">AI</text>
</svg>
