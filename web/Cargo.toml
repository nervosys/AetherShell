[package]
name = "aether_wasm"
version = "0.3.1"
edition = "2021"
authors = ["Nervosys <contact@nervosys.ai>"]
description = "AetherShell WebAssembly bindings for browser execution"
license = "AGPL-3.0-or-later"
repository = "https://github.com/nervosys/AetherShell"

# Exclude from parent workspace
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
once_cell = "1"
js-sys = "0.3"
aethershell = { path = "../", default-features = false, features = ["web"] }

[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Response",
    "Headers",
    "Request",
    "RequestInit",
    "RequestMode",
    "console",
]

# Enable js feature for getrandom 0.2 (used by rand and other crates)
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = [
    "wasm_js",
] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
