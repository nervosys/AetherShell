[package]
name = "aether_wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
once_cell = "1"

# NOTE: path to aether_shell crate
aether_shell = { path = "../", default-features = false, features = ["web"] }

[dependencies.js-sys]
version = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
    "Window",
    "Response",
    "Headers",
    "Request",
    "RequestInit",
    "RequestMode",
    "console",
]

[dev-dependencies]
wasm-bindgen-test = "0.3"
