# cargo-audit policy. cargo-audit reads this file from the repo root's .cargo/.
# Keep in step with the matching entries in deny.toml.

[advisories]
ignore = [
    # zip 0.6.6 and zip 1.1.4 -- all three advisories are about ZipArchive::extract()
    # and ZipStreamReader::extract() (symlink targets, SUID/SGID, permissions through
    # symlinks). Neither copy is reached through extract() by our code.
    #   zip 0.6.6: build-dependency of utoipa-swagger-ui 6.0.0 (build.rs reads its
    #              bundled swagger-ui zip with by_index, no extract()).
    #   zip 1.1.4: optional candle-core 0.8.4 (local-inference feature) reads .npz with
    #              zip; candle-core 0.8.x is the newest 0.8 and still pins zip 1.x.
    # Remove when zip >= 9 is the only zip left in Cargo.lock.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]
