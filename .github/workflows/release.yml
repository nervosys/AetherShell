name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            version:
                description: "Version to release (e.g., 0.2.0)"
                required: true
                type: string

env:
    CARGO_TERM_COLOR: always

jobs:
    create-release:
        name: Create Release
        runs-on: ubuntu-latest
        outputs:
            upload_url: ${{ steps.create_release.outputs.upload_url }}
            version: ${{ steps.get_version.outputs.version }}
        steps:
            - uses: actions/checkout@v4

            - name: Get version
              id: get_version
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
                  else
                    echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
                  fi

            - name: Create Release
              id: create_release
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: v${{ steps.get_version.outputs.version }}
                  name: AetherShell v${{ steps.get_version.outputs.version }}
                  # Was `draft: true` until 2026-08-07, which silently produced
                  # *two* releases per tag and threw away the notes.
                  #
                  # A draft release is not bound to its tag until published. So
                  # this step created an unattached draft holding the generated
                  # notes, and then each `Upload Release Asset` step below asked
                  # softprops for the release on tag `vX.Y.Z`, found none, and
                  # created a second one — published, with the assets, and with
                  # an empty body. The draft was orphaned.
                  #
                  # The result: 18 empty drafts accumulated from v0.3.0 to
                  # v4.0.0, and every published release had no release notes.
                  # Both symptoms had been visible on the releases page for
                  # months.
                  #
                  # Publishing directly means the upload steps find this release
                  # by tag and attach to it, so there is one release per tag and
                  # the notes survive.
                  draft: false
                  prerelease: false
                  generate_release_notes: true

    build-binaries:
        name: Build (${{ matrix.target }})
        needs: create-release
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: x86_64-unknown-linux-gnu
                      os: ubuntu-latest
                      archive: tar.gz
                    - target: x86_64-unknown-linux-musl
                      os: ubuntu-latest
                      archive: tar.gz
                    - target: aarch64-unknown-linux-gnu
                      os: ubuntu-latest
                      archive: tar.gz
                    - target: x86_64-apple-darwin
                      os: macos-latest
                      archive: tar.gz
                    - target: aarch64-apple-darwin
                      os: macos-latest
                      archive: tar.gz
                    - target: x86_64-pc-windows-msvc
                      os: windows-latest
                      archive: zip
        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - uses: Swatinem/rust-cache@v2
              with:
                  key: release-${{ matrix.target }}

            - name: Install cross-compilation tools (Linux ARM)
              if: matrix.target == 'aarch64-unknown-linux-gnu'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y gcc-aarch64-linux-gnu libasound2-dev libssl-dev pkg-config

            - name: Install musl tools
              if: matrix.target == 'x86_64-unknown-linux-musl'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y musl-tools libasound2-dev libssl-dev pkg-config

            - name: Install Linux dependencies
              if: matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64-unknown-linux-gnu'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libasound2-dev libssl-dev pkg-config

            - name: Build
              run: cargo build --release --target ${{ matrix.target }} --features native

            - name: Package (Unix)
              if: matrix.os != 'windows-latest'
              run: |
                  cd target/${{ matrix.target }}/release
                  tar czvf ../../../aethershell-${{ needs.create-release.outputs.version }}-${{ matrix.target }}.tar.gz ae aimodel

            - name: Package (Windows)
              if: matrix.os == 'windows-latest'
              run: |
                  cd target/${{ matrix.target }}/release
                  7z a ../../../aethershell-${{ needs.create-release.outputs.version }}-${{ matrix.target }}.zip ae.exe aimodel.exe

            - name: Upload Release Asset
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: v${{ needs.create-release.outputs.version }}
                  files: aethershell-${{ needs.create-release.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}

    build-wasm:
        name: Build WASM
        needs: create-release
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown

            - uses: Swatinem/rust-cache@v2

            - name: Install wasm-pack
              run: cargo install wasm-pack

            - name: Build WASM
              run: |
                  cd web
                  wasm-pack build --target web --release

            - name: Package WASM
              run: |
                  cd web
                  tar czvf ../aethershell-wasm-${{ needs.create-release.outputs.version }}.tar.gz pkg/

            - name: Upload WASM Release Asset
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: v${{ needs.create-release.outputs.version }}
                  files: aethershell-wasm-${{ needs.create-release.outputs.version }}.tar.gz

    publish-crates:
        name: Publish to crates.io
        needs: [create-release, build-binaries]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable

            - name: Publish to crates.io
              env:
                  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
              id: cargo_publish
              run: |
                  cargo publish --features native
              # CORRECTION (2026-08-07): an earlier version of this comment said
              # this step "demonstrably works — crates.io has the published
              # versions". That was wrong, and wrong in the same way as the
              # findings it sat next to.
              #
              # `gh secret list` returns *no secrets at all* for this
              # repository, and the v4.1.0 run's environment shows
              # `CARGO_REGISTRY_TOKEN:` empty (a set secret renders as ***).
              # crates.io has the versions because they were published manually
              # from a maintainer's local token. CI has never published one.
              #
              # So all three publish jobs have always failed, for three
              # unrelated reasons — no OIDC config (PyPI), no NPM_TOKEN, no
              # CARGO_REGISTRY_TOKEN — and the suppression made all three
              # indistinguishable from success.
              #
              # Keeping continue-on-error is still right *here*: re-running a
              # release for an already-published version fails harmlessly and
              # must not fail the release. Set the secret, and let the
              # verification step below tell you whether it worked.
              continue-on-error: true

            - name: Verify the publish actually landed
              # `continue-on-error` above rewrites a failed publish to `success`,
              # so the step, the job and the run all report green whether or not
              # anything was published. This asks the registry instead of
              # trusting the step. See finding 12.
              #
              # CORRECTION (2026-08-10): the first version of this step checked
              # only whether the version was *on the registry*, and was
              # deliberately non-fatal. The v5.0.0 run showed why that is not
              # enough. Its log reads:
              #
              #     CARGO_REGISTRY_TOKEN:
              #     error: crate aethershell@5.0.0 already exists on crates.io index
              #     ##[error]Process completed with exit code 101
              #
              # …and this step then printed "✅ 5.0.0 is published" — true, but
              # only because a maintainer had published it by hand minutes
              # earlier. Checking the registry proves the *state*, not that this
              # run did anything. So it reported green over a publish step that
              # had exited 101, which is the exact failure mode it was added to
              # catch, one level up.
              #
              # Now it reports both facts and fails the job when this run's
              # publish did not succeed. `continue-on-error` above still keeps
              # the rest of the release going; the difference is that the
              # *outcome* is no longer silently rewritten to success.
              if: always()
              run: |
                  set -uo pipefail
                  VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
                  OUTCOME="${{ steps.cargo_publish.outcome }}"

                  if curl -sfA "aethershell-release-verify" \
                       "https://crates.io/api/v1/crates/aethershell/${VERSION}" >/dev/null; then
                    ON_REGISTRY=yes
                  else
                    ON_REGISTRY=no
                  fi

                  {
                    echo "### crates.io — \`aethershell\` ${VERSION}"
                    echo
                    echo "| check | result |"
                    echo "| --- | --- |"
                    echo "| this run's \`cargo publish\` | ${OUTCOME} |"
                    echo "| present on crates.io | ${ON_REGISTRY} |"
                  } | tee -a "$GITHUB_STEP_SUMMARY"

                  if [ "$OUTCOME" != "success" ]; then
                    {
                      echo
                      echo "⛔ **This run did not publish.** The publish step exited non-zero"
                      echo "(see its log above). If \`present on crates.io\` is \`yes\`, the"
                      echo "version got there some other way — most likely a manual"
                      echo "\`cargo publish\` — which is not a working release pipeline."
                      echo
                      echo "Most common cause: \`CARGO_REGISTRY_TOKEN\` is not set on this"
                      echo "repository. An unset secret renders as empty in the step env;"
                      echo "a set one renders as \`***\`."
                    } | tee -a "$GITHUB_STEP_SUMMARY"
                    exit 1
                  fi

                  if [ "$ON_REGISTRY" != "yes" ]; then
                    echo "⛔ publish reported success but ${VERSION} is not on crates.io." \
                      | tee -a "$GITHUB_STEP_SUMMARY"
                    exit 1
                  fi

                  echo "✅ this run published ${VERSION} to crates.io." \
                    | tee -a "$GITHUB_STEP_SUMMARY"

    publish-npm:
        name: Publish WASM to npm
        needs: [create-release, build-wasm]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown

            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  registry-url: "https://registry.npmjs.org"

            - name: Install wasm-pack
              run: cargo install wasm-pack

            - name: Build WASM
              run: |
                  cd web
                  wasm-pack build --target web --release

            - name: Publish to npm
              id: npm_publish
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  cd web/pkg
                  npm publish --access public
              # WARNING (2026-08-07): this has never succeeded. `aethershell` is
              # unregistered on npm, and this suppression is why nobody noticed
              # across every release to date. `web/package.json` still says
              # 0.2.0 while the crate is at 4.0.0 — had a publish ever landed,
              # the version would have moved.
              #
              # Observed on the v4.0.0 release: NODE_AUTH_TOKEN was empty (a
              # populated secret renders as ***), so npm failed with
              # `ENEEDAUTH` — the NPM_TOKEN secret has never been set. The job
              # still reported `completed/success`, because continue-on-error
              # rewrites the step conclusion.
              #
              # Set NPM_TOKEN before removing this line. Finding 12 in
              # docs/security/SECURITY_AUDIT_2026-07-30.md. Either make this
              # work or delete the job; leaving it suppressed means the workflow
              # reads as publishing to three registries while reaching one.
              continue-on-error: true

            - name: Verify the publish actually landed
              # Asks npm rather than trusting the step above, which reports
              # success either way. See finding 12. Non-fatal by design; the
              # value is that the answer stops being invisible.
              #
              # Name and version are read from the artifact that is actually
              # published (web/pkg/package.json, generated by wasm-pack) rather
              # than assumed. They are not what you would guess: that file says
              # `aether_wasm`, while the hand-maintained web/package.json says
              # `@nervosys/aethershell`. Hardcoding either would produce a check
              # that passes or fails for the wrong package.
              if: always()
              run: |
                  set -uo pipefail
                  PKG="web/pkg/package.json"
                  NAME="$(jq -r .name "$PKG" 2>/dev/null || echo '')"
                  VERSION="$(jq -r .version "$PKG" 2>/dev/null || echo '')"
                  if [ -z "$NAME" ] || [ "$NAME" = "null" ] || [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
                    echo "### ⚠️ npm: could not read name/version from ${PKG}" | tee -a "$GITHUB_STEP_SUMMARY"
                    exit 0
                  fi
                  # Same correction as the crates.io job (2026-08-10): presence on
                  # the registry proves the state, not that *this run* published.
                  # Report both, and fail when this run's publish did not succeed.
                  if [ "${{ steps.npm_publish.outcome }}" != "success" ]; then
                    {
                      echo "### ⛔ npm: this run did not publish"
                      echo
                      echo "\`${NAME}\` **${VERSION}** — publish step outcome:"
                      echo "\`${{ steps.npm_publish.outcome }}\`. As of 2026-08-07 the cause"
                      echo "was an unset \`NPM_TOKEN\` (\`npm error code ENEEDAUTH\`)."
                      echo
                      echo "Decide the package name before setting a token: this artifact"
                      echo "is \`${NAME}\`, while \`web/package.json\` says"
                      echo "\`@nervosys/aethershell\`. The first success claims a name publicly."
                    } | tee -a "$GITHUB_STEP_SUMMARY"
                    exit 1
                  fi
                  if curl -sf "https://registry.npmjs.org/${NAME}/${VERSION}" >/dev/null; then
                    echo "✅ npm: this run published \`${NAME}\` **${VERSION}**." | tee -a "$GITHUB_STEP_SUMMARY"
                  else
                    {
                      echo "### ⚠️ npm publish did NOT land"
                      echo
                      echo "\`${NAME}\` **${VERSION}** is not on npm, even though the publish"
                      echo "step reported success (\`continue-on-error\` masks failures)."
                      echo
                      echo "As of 2026-08-07 the cause was an unset \`NPM_TOKEN\` secret"
                      echo "(\`npm error code ENEEDAUTH\`). See finding 12 in"
                      echo "\`docs/security/SECURITY_AUDIT_2026-07-30.md\`."
                    } | tee -a "$GITHUB_STEP_SUMMARY"
                  fi

    update-homebrew:
        name: Update Homebrew Formula
        needs: [create-release, build-binaries]
        runs-on: ubuntu-latest
        steps:
            - name: Trigger Homebrew tap update
              run: |
                  echo "Homebrew formula update would be triggered here"
                  echo "Version: ${{ needs.create-release.outputs.version }}"
                  # This would typically:
                  # 1. Calculate SHA256 of the release tarball
                  # 2. Update the formula in nervosys/homebrew-tap
                  # 3. Create a PR or push directly

    publish-pypi:
        name: Publish Python SDK to PyPI
        needs: [create-release]
        runs-on: ubuntu-latest
        permissions:
            id-token: write
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install build tools
              run: pip install build twine

            - name: Build package
              working-directory: integrations/python
              run: python -m build

            - name: Publish to PyPI
              id: pypi_publish
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  packages-dir: integrations/python/dist/
              # WARNING (2026-08-07): this has never succeeded, and unlike npm
              # it is user-facing — docs told readers to `pip install
              # aethershell`, and that name is unregistered on PyPI. Anyone may
              # claim it, and pip executes package code at install time. A live
              # supply-chain exposure, not just a broken job.
              #
              # Observed on the v4.0.0 release: the action logs
              # `outcome=failure;conclusion=failure` with `environment:
              # MISSING` — trusted publishing is not configured for this repo —
              # and `continue-on-error` then rewrites the step to `success`, so
              # the job and the whole run report green. Every signal visible
              # from inside this repository says it worked. Only querying PyPI
              # shows it never has.
              #
              # Fix trusted publishing before removing this line, or the
              # release fails. Finding 12 in
              # docs/security/SECURITY_AUDIT_2026-07-30.md.
              continue-on-error: true

            - name: Verify the publish actually landed
              # Asks PyPI rather than trusting the step above, which reports
              # success either way. This check is what turns finding 12 from
              # "nobody noticed for every release" into "the release tells you".
              # Non-fatal by design.
              if: always()
              run: |
                  set -uo pipefail
                  VERSION="$(grep -m1 '^version' integrations/python/pyproject.toml | cut -d'"' -f2)"
                  # Same correction as the crates.io job (2026-08-10). The name is
                  # now registered (a maintainer published 1.5.0 by hand), so a
                  # registry-presence check alone would report green forever while
                  # CI published nothing.
                  if [ "${{ steps.pypi_publish.outcome }}" != "success" ]; then
                    {
                      echo "### ⛔ PyPI: this run did not publish"
                      echo
                      echo "\`aethershell\` **${VERSION}** — publish step outcome:"
                      echo "\`${{ steps.pypi_publish.outcome }}\`. As of 2026-08-07 the cause was"
                      echo "that trusted publishing is not configured for this repository"
                      echo "(\`environment: MISSING\` in the OIDC claim)."
                      echo
                      echo "If the version is on PyPI anyway, it was published manually."
                    } | tee -a "$GITHUB_STEP_SUMMARY"
                    exit 1
                  fi
                  if curl -sf "https://pypi.org/pypi/aethershell/${VERSION}/json" >/dev/null; then
                    echo "✅ PyPI: this run published \`aethershell\` **${VERSION}**." | tee -a "$GITHUB_STEP_SUMMARY"
                  else
                    {
                      echo "### ⚠️ PyPI publish did NOT land"
                      echo
                      echo "\`aethershell\` **${VERSION}** is not on PyPI, even though the publish"
                      echo "step reported success (\`continue-on-error\` masks failures)."
                      echo
                      echo "As of 2026-08-07 the cause was that trusted publishing is not"
                      echo "configured for this repository (\`environment: MISSING\` in the OIDC"
                      echo "claim). **The package name is also unregistered**, and the docs"
                      echo "previously told users to \`pip install aethershell\` — anyone may"
                      echo "claim the name, and pip executes package code at install time."
                      echo "See finding 12 in \`docs/security/SECURITY_AUDIT_2026-07-30.md\`."
                    } | tee -a "$GITHUB_STEP_SUMMARY"
                  fi

    build-linux-packages:
        name: Linux Packages (.deb/.rpm)
        needs: [create-release, build-binaries]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2
              with:
                  key: linux-packages

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libasound2-dev libssl-dev pkg-config

            - name: Install packaging tools
              run: cargo install cargo-deb cargo-generate-rpm

            - name: Build release binary
              run: cargo build --release --features native

            - name: Build .deb package
              run: cargo deb --no-build

            - name: Build .rpm package
              run: cargo generate-rpm

            - name: Upload .deb package
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: v${{ needs.create-release.outputs.version }}
                  files: target/debian/*.deb

            - name: Upload .rpm package
              uses: softprops/action-gh-release@v1
              with:
                  tag_name: v${{ needs.create-release.outputs.version }}
                  files: target/generate-rpm/*.rpm