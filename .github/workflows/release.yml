name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            version:
                description: "Version to release (e.g., 0.2.0)"
                required: true
                type: string

env:
    CARGO_TERM_COLOR: always

jobs:
    # Resolves the version only. The job keeps its id because every other job
    # reads `needs.create-release.outputs.version`; the release itself is made
    # by publish-release, after every asset is built.
    create-release:
        name: Resolve version
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.get_version.outputs.version }}
        steps:
            - uses: actions/checkout@v4

            - name: Get version
              id: get_version
              env:
                  REQUESTED_VERSION: ${{ inputs.version }}
              run: |
                  set -euo pipefail
                  python3 scripts/test_release_version.py
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    VERSION="$REQUESTED_VERSION"
                  else
                    VERSION="${GITHUB_REF#refs/tags/v}"
                  fi
                  python3 scripts/release_version.py "$VERSION" >> "$GITHUB_OUTPUT"

    build-binaries:
        name: Build (${{ matrix.target }})
        needs: create-release
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: x86_64-unknown-linux-gnu
                      os: ubuntu-latest
                      archive: tar.gz
                    - target: x86_64-unknown-linux-musl
                      os: ubuntu-latest
                      archive: tar.gz
                    - target: aarch64-unknown-linux-gnu
                      os: ubuntu-latest
                      archive: tar.gz
                    - target: x86_64-apple-darwin
                      os: macos-latest
                      archive: tar.gz
                    - target: aarch64-apple-darwin
                      os: macos-latest
                      archive: tar.gz
                    - target: x86_64-pc-windows-msvc
                      os: windows-latest
                      archive: zip
        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - uses: Swatinem/rust-cache@v2
              with:
                  key: release-${{ matrix.target }}

            - name: Install cross-compilation tools (Linux ARM)
              if: matrix.target == 'aarch64-unknown-linux-gnu'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y gcc-aarch64-linux-gnu libasound2-dev libssl-dev pkg-config

            - name: Install musl tools
              if: matrix.target == 'x86_64-unknown-linux-musl'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y musl-tools libasound2-dev libssl-dev pkg-config

            - name: Install Linux dependencies
              if: matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64-unknown-linux-gnu'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libasound2-dev libssl-dev pkg-config

            - name: Build
              run: cargo build --release --target ${{ matrix.target }} --features native

            - name: Package (Unix)
              if: matrix.os != 'windows-latest'
              run: |
                  cd target/${{ matrix.target }}/release
                  tar czvf ../../../ironshell-${{ needs.create-release.outputs.version }}-${{ matrix.target }}.tar.gz ish ae aimodel

            - name: Package (Windows)
              if: matrix.os == 'windows-latest'
              run: |
                  cd target/${{ matrix.target }}/release
                  7z a ../../../ironshell-${{ needs.create-release.outputs.version }}-${{ matrix.target }}.zip ish.exe ae.exe aimodel.exe

            - name: Hand the archive to publish-release
              uses: actions/upload-artifact@v4
              with:
                  name: release-${{ matrix.target }}
                  path: ironshell-${{ needs.create-release.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}
                  if-no-files-found: error

    build-wasm:
        name: Build WASM
        needs: create-release
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown

            - uses: Swatinem/rust-cache@v2

            - name: Install wasm-pack
              run: cargo install wasm-pack

            - name: Build WASM
              run: |
                  cd web
                  wasm-pack build --target web --release

            - name: Package WASM
              run: |
                  cd web
                  tar czvf ../ironshell-wasm-${{ needs.create-release.outputs.version }}.tar.gz pkg/

            - name: Hand the archive to publish-release
              uses: actions/upload-artifact@v4
              with:
                  name: release-wasm
                  path: ironshell-wasm-${{ needs.create-release.outputs.version }}.tar.gz
                  if-no-files-found: error

    publish-preflight:
        # Which registries are actually configured on this repository.
        #
        # Every publish job has failed on every release since the pipeline
        # existed, always for the same reason: the credential is not set. A run
        # that is red unconditionally cannot report a regression -- the signal
        # was spent long ago, and the honest primitive GitHub offers for "not
        # applicable" is *skipped*, not green. `continue-on-error` was the other
        # option and this repository has already been burned by it: it rewrote a
        # failed publish to success and every signal inside the repo said the
        # release worked.
        #
        # So: unconfigured -> the job is skipped and says why. Configured and
        # broken -> red, and red now means something.
        name: Which registries are configured
        needs: [create-release]
        runs-on: ubuntu-latest
        outputs:
            crates: ${{ steps.probe.outputs.crates }}
            npm: ${{ steps.probe.outputs.npm }}
            pypi: ${{ steps.probe.outputs.pypi }}
        steps:
            - id: probe
              # Secrets cannot be referenced in a job-level `if`, so presence is
              # resolved here and passed on as an output. The values are only
              # ever tested for emptiness; nothing is echoed.
              env:
                  CRATES: ${{ secrets.CARGO_REGISTRY_TOKEN }}
                  NPM: ${{ secrets.NPM_TOKEN }}
                  # PyPI uses trusted publishing (OIDC), so there is no secret to
                  # detect. It is an explicit opt-in: set the repository variable
                  # PYPI_TRUSTED_PUBLISHING=true once configured at pypi.org.
                  PYPI: ${{ vars.PYPI_TRUSTED_PUBLISHING }}
              run: |
                  set -uo pipefail
                  for reg in crates npm pypi; do
                    case "$reg" in
                      crates) v="${CRATES:-}" ;;
                      npm)    v="${NPM:-}" ;;
                      pypi)   v="${PYPI:-}" ;;
                    esac
                    if [ -n "$v" ] && [ "$v" != "false" ]; then
                      echo "${reg}=true" >> "$GITHUB_OUTPUT"
                    else
                      echo "${reg}=false" >> "$GITHUB_OUTPUT"
                    fi
                  done
                  {
                    echo "### Registry configuration"
                    echo
                    echo "| registry | configured |"
                    echo "| --- | --- |"
                    echo "| crates.io | $([ -n "${CRATES:-}" ] && echo yes || echo '**no — publish skipped**') |"
                    echo "| npm | $([ -n "${NPM:-}" ] && echo yes || echo '**no — publish skipped**') |"
                    echo "| PyPI | $([ -n "${PYPI:-}" ] && [ "${PYPI:-}" != false ] && echo yes || echo '**no — publish skipped**') |"
                    echo
                    echo "A skipped publish is not a failure. Set the secret or repository"
                    echo "variable to enable one; a red publish job then means it genuinely broke."
                  } >> "$GITHUB_STEP_SUMMARY"

    publish-crates:
        name: Publish to crates.io
        needs: [create-release, publish-release, publish-preflight]
        if: needs.publish-preflight.outputs.crates == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable

            - name: Publish to crates.io
              env:
                  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
              id: cargo_publish
              run: |
                  cargo publish --features native
              # CORRECTION (2026-08-07): an earlier version of this comment said
              # this step "demonstrably works — crates.io has the published
              # versions". That was wrong, and wrong in the same way as the
              # findings it sat next to.
              #
              # `gh secret list` returns *no secrets at all* for this
              # repository, and the v4.1.0 run's environment shows
              # `CARGO_REGISTRY_TOKEN:` empty (a set secret renders as ***).
              # crates.io has the versions because they were published manually
              # from a maintainer's local token. CI has never published one.
              #
              # So all three publish jobs have always failed, for three
              # unrelated reasons — no OIDC config (PyPI), no NPM_TOKEN, no
              # CARGO_REGISTRY_TOKEN — and the suppression made all three
              # indistinguishable from success.
              #
              # Keeping continue-on-error is still right *here*: re-running a
              # release for an already-published version fails harmlessly and
              # must not fail the release. Set the secret, and let the
              # verification step below tell you whether it worked.
              continue-on-error: true

            - name: Verify the publish actually landed
              # `continue-on-error` above rewrites a failed publish to `success`,
              # so the step, the job and the run all report green whether or not
              # anything was published. This asks the registry instead of
              # trusting the step. See finding 12.
              #
              # CORRECTION (2026-08-10): the first version of this step checked
              # only whether the version was *on the registry*, and was
              # deliberately non-fatal. The v5.0.0 run showed why that is not
              # enough. Its log reads:
              #
              #     CARGO_REGISTRY_TOKEN:
              #     error: crate ironshell@5.0.0 already exists on crates.io index
              #     ##[error]Process completed with exit code 101
              #
              # …and this step then printed "✅ 5.0.0 is published" — true, but
              # only because a maintainer had published it by hand minutes
              # earlier. Checking the registry proves the *state*, not that this
              # run did anything. So it reported green over a publish step that
              # had exited 101, which is the exact failure mode it was added to
              # catch, one level up.
              #
              # Now it reports both facts and fails the job when this run's
              # publish did not succeed. `continue-on-error` above still keeps
              # the rest of the release going; the difference is that the
              # *outcome* is no longer silently rewritten to success.
              if: always()
              run: |
                  set -uo pipefail
                  VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
                  OUTCOME="${{ steps.cargo_publish.outcome }}"

                  if curl -sfA "ironshell-release-verify" \
                       "https://crates.io/api/v1/crates/iron-shell/${VERSION}" >/dev/null; then
                    ON_REGISTRY=yes
                  else
                    ON_REGISTRY=no
                  fi

                  {
                    echo "### crates.io — \`iron-shell\` ${VERSION}"
                    echo
                    echo "| check | result |"
                    echo "| --- | --- |"
                    echo "| this run's \`cargo publish\` | ${OUTCOME} |"
                    echo "| present on crates.io | ${ON_REGISTRY} |"
                  } | tee -a "$GITHUB_STEP_SUMMARY"

                  if [ "$OUTCOME" != "success" ]; then
                    {
                      echo
                      echo "⛔ **This run did not publish.** The publish step exited non-zero"
                      echo "(see its log above). If \`present on crates.io\` is \`yes\`, the"
                      echo "version got there some other way — most likely a manual"
                      echo "\`cargo publish\` — which is not a working release pipeline."
                      echo
                      echo "Most common cause: \`CARGO_REGISTRY_TOKEN\` is not set on this"
                      echo "repository. An unset secret renders as empty in the step env;"
                      echo "a set one renders as \`***\`."
                    } | tee -a "$GITHUB_STEP_SUMMARY"
                    exit 1
                  fi

                  if [ "$ON_REGISTRY" != "yes" ]; then
                    echo "⛔ publish reported success but ${VERSION} is not on crates.io." \
                      | tee -a "$GITHUB_STEP_SUMMARY"
                    exit 1
                  fi

                  echo "✅ this run published ${VERSION} to crates.io." \
                    | tee -a "$GITHUB_STEP_SUMMARY"

    publish-npm:
        name: Publish WASM to npm
        needs: [create-release, publish-release, publish-preflight]
        if: needs.publish-preflight.outputs.npm == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown

            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  registry-url: "https://registry.npmjs.org"

            - name: Install wasm-pack
              run: cargo install wasm-pack

            - name: Build WASM
              run: |
                  cd web
                  wasm-pack build --target web --release

            - name: Name the package
              # The name was decided on 2026-08-11: **`@nervosys/aethershell`**.
              #
              # wasm-pack derives the manifest name from the crate name in
              # web/Cargo.toml, which is `ironshell_wasm` — so the artifact this job
              # publishes would claim the wrong name. Renaming the crate would also
              # rename the generated `ironshell_wasm.js`/`.d.ts` that `web/ironshell.js`
              # imports, so the name is set on the manifest instead, which is the
              # narrow change. `--access public` below is required for a scoped
              # package; without it npm rejects the first publish as private.
              run: |
                  set -euo pipefail
                  PKG=web/pkg/package.json
                  jq '.name = "@nervosys/aethershell"' "$PKG" > "$PKG.tmp"
                  mv "$PKG.tmp" "$PKG"
                  echo "publishing as $(jq -r .name "$PKG") $(jq -r .version "$PKG")"

            - name: Publish to npm
              id: npm_publish
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  cd web/pkg
                  npm publish --access public
              # WARNING (2026-08-07): this has never succeeded. Nothing has ever been
              # published to npm under any name, and this suppression is why nobody
              # noticed across every release to date. `web/package.json` still says
              # 0.2.0 while the crate is at 4.0.0 — had a publish ever landed,
              # the version would have moved.
              #
              # Observed on the v4.0.0 release: NODE_AUTH_TOKEN was empty (a
              # populated secret renders as ***), so npm failed with
              # `ENEEDAUTH` — the NPM_TOKEN secret has never been set. The job
              # still reported `completed/success`, because continue-on-error
              # rewrites the step conclusion.
              #
              # Set NPM_TOKEN before removing this line. Finding 12 in
              # docs/security/SECURITY_AUDIT_2026-07-30.md. Either make this
              # work or delete the job; leaving it suppressed means the workflow
              # reads as publishing to three registries while reaching one.
              continue-on-error: true

            - name: Verify the publish actually landed
              # Asks npm rather than trusting the step above, which reports
              # success either way. See finding 12. Non-fatal by design; the
              # value is that the answer stops being invisible.
              #
              # Name and version are read from the artifact that is actually
              # published (web/pkg/package.json) rather than assumed, so this
              # verifies whatever was really sent. wasm-pack generates that file
              # with the crate's name (`ironshell_wasm`); the "Name the package" step
              # rewrites it to `@nervosys/aethershell` beforehand. Reading it back
              # here means a change to that step cannot silently desync the check.
              if: always()
              run: |
                  set -uo pipefail
                  PKG="web/pkg/package.json"
                  NAME="$(jq -r .name "$PKG" 2>/dev/null || echo '')"
                  VERSION="$(jq -r .version "$PKG" 2>/dev/null || echo '')"
                  if [ -z "$NAME" ] || [ "$NAME" = "null" ] || [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
                    echo "### ⚠️ npm: could not read name/version from ${PKG}" | tee -a "$GITHUB_STEP_SUMMARY"
                    exit 0
                  fi
                  # Same correction as the crates.io job (2026-08-10): presence on
                  # the registry proves the state, not that *this run* published.
                  # Report both, and fail when this run's publish did not succeed.
                  if [ "${{ steps.npm_publish.outcome }}" != "success" ]; then
                    {
                      echo "### ⛔ npm: this run did not publish"
                      echo
                      echo "\`${NAME}\` **${VERSION}** — publish step outcome:"
                      echo "\`${{ steps.npm_publish.outcome }}\`. As of 2026-08-07 the cause"
                      echo "was an unset \`NPM_TOKEN\` (\`npm error code ENEEDAUTH\`)."
                      echo
                      echo "The name is settled (2026-08-11): \`@nervosys/aethershell\`,"
                      echo "set on the manifest by the \"Name the package\" step above."
                      echo "This artifact reports \`${NAME}\`. Setting \`NPM_TOKEN\` is now the"
                      echo "only thing between this job and a first publish — which claims"
                      echo "the name publicly and irreversibly."
                    } | tee -a "$GITHUB_STEP_SUMMARY"
                    exit 1
                  fi
                  if curl -sf "https://registry.npmjs.org/${NAME}/${VERSION}" >/dev/null; then
                    echo "✅ npm: this run published \`${NAME}\` **${VERSION}**." | tee -a "$GITHUB_STEP_SUMMARY"
                  else
                    {
                      echo "### ⚠️ npm publish did NOT land"
                      echo
                      echo "\`${NAME}\` **${VERSION}** is not on npm, even though the publish"
                      echo "step reported success (\`continue-on-error\` masks failures)."
                      echo
                      echo "As of 2026-08-07 the cause was an unset \`NPM_TOKEN\` secret"
                      echo "(\`npm error code ENEEDAUTH\`). See finding 12 in"
                      echo "\`docs/security/SECURITY_AUDIT_2026-07-30.md\`."
                    } | tee -a "$GITHUB_STEP_SUMMARY"
                  fi

    homebrew-digest:
        # Was `update-homebrew`, a job whose only step echoed "Homebrew formula
        # update would be triggered here" and exited 0 -- so every release
        # reported a green "Update Homebrew Formula" while updating nothing.
        # That is the same defect as the publish jobs above: a name that claims
        # an action, and a success that means the echo worked.
        #
        # Pushing to the tap needs a token this repository does not have, so
        # this does the half that does not: it computes the digest the formula
        # needs and puts it in the run summary. The formula is then a one-line
        # edit instead of a manual download-and-hash. The job is named for what
        # it does.
        name: Homebrew formula digest
        needs: [create-release, build-binaries]
        runs-on: ubuntu-latest
        steps:
            - name: Compute the release tarball digest
              env:
                  VERSION: ${{ needs.create-release.outputs.version }}
              run: |
                  set -euo pipefail
                  url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/v${VERSION}.tar.gz"
                  # The tarball is generated on demand and can lag the tag by a
                  # few seconds on a fresh release.
                  for attempt in 1 2 3 4 5; do
                    if curl -sSfL "$url" -o release.tar.gz; then break; fi
                    echo "tarball not ready yet (attempt $attempt); waiting"
                    sleep 10
                  done
                  test -s release.tar.gz
                  digest="$(sha256sum release.tar.gz | cut -d' ' -f1)"
                  # To stdout as well as the summary. The first version wrote
                  # only to $GITHUB_STEP_SUMMARY, which cannot be read back
                  # from the API or grepped from the log -- so the digest could
                  # not be cross-checked against the committed formula, which
                  # was the reason for computing it here at all.
                  echo "tarball-bytes=$(wc -c < release.tar.gz)"
                  echo "tarball-sha256=$digest"
                  {
                    echo "### Homebrew formula"
                    echo
                    echo "Pushing to the tap is not configured, so update"
                    echo '`Formula/ironshell.rb` by hand:'
                    echo
                    echo '```ruby'
                    echo "  url \"$url\""
                    echo "  sha256 \"$digest\""
                    echo '```'
                    echo
                    echo "\`published_contracts\` checks both lines against the crate version."
                  } >> "$GITHUB_STEP_SUMMARY"

    publish-pypi:
        name: Publish Python SDK to PyPI
        needs: [create-release, publish-release, publish-preflight]
        if: needs.publish-preflight.outputs.pypi == 'true'
        runs-on: ubuntu-latest
        permissions:
            id-token: write
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install build tools
              run: pip install build twine

            - name: Build package
              working-directory: integrations/python
              run: python -m build

            - name: Publish to PyPI
              id: pypi_publish
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  packages-dir: integrations/python/dist/
              # WARNING (2026-08-07, updated 2026-09-02): this has never
              # succeeded from CI.
              #
              # The original note said the `ironshell` name was unregistered
              # on PyPI, that anyone could claim it, and that since pip executes
              # package code at install time this was a live supply-chain
              # exposure rather than merely a broken job. That was true when it
              # was written and is not true now: the name was registered on
              # 2026-08-10 by a manual upload, and PyPI reports 1.5.0 authored
              # by `nervosys <contact@nervosys.ai>` with project URLs pointing
              # at this repository. Verified against the PyPI API, not assumed.
              #
              # What remains true is everything below: CI has never published,
              # and `continue-on-error` hides that.
              #
              # Observed on the v4.0.0 release: the action logs
              # `outcome=failure;conclusion=failure` with `environment:
              # MISSING` — trusted publishing is not configured for this repo —
              # and `continue-on-error` then rewrites the step to `success`, so
              # the job and the whole run report green. Every signal visible
              # from inside this repository says it worked. Only querying PyPI
              # shows it never has.
              #
              # Fix trusted publishing before removing this line, or the
              # release fails. Finding 12 in
              # docs/security/SECURITY_AUDIT_2026-07-30.md.
              continue-on-error: true

            - name: Verify the publish actually landed
              # Asks PyPI rather than trusting the step above, which reports
              # success either way. This check is what turns finding 12 from
              # "nobody noticed for every release" into "the release tells you".
              # Non-fatal by design.
              if: always()
              run: |
                  set -uo pipefail
                  VERSION="$(grep -m1 '^version' integrations/python/pyproject.toml | cut -d'"' -f2)"
                  # Same correction as the crates.io job (2026-08-10). The name is
                  # now registered (a maintainer published 1.5.0 by hand), so a
                  # registry-presence check alone would report green forever while
                  # CI published nothing.
                  if [ "${{ steps.pypi_publish.outcome }}" != "success" ]; then
                    {
                      echo "### ⛔ PyPI: this run did not publish"
                      echo
                      echo "\`ironshell\` **${VERSION}** — publish step outcome:"
                      echo "\`${{ steps.pypi_publish.outcome }}\`. As of 2026-08-07 the cause was"
                      echo "that trusted publishing is not configured for this repository"
                      echo "(\`environment: MISSING\` in the OIDC claim)."
                      echo
                      echo "If the version is on PyPI anyway, it was published manually."
                    } | tee -a "$GITHUB_STEP_SUMMARY"
                    exit 1
                  fi
                  if curl -sf "https://pypi.org/pypi/ironshell/${VERSION}/json" >/dev/null; then
                    echo "✅ PyPI: this run published \`ironshell\` **${VERSION}**." | tee -a "$GITHUB_STEP_SUMMARY"
                  else
                    {
                      echo "### ⚠️ PyPI publish did NOT land"
                      echo
                      echo "\`ironshell\` **${VERSION}** is not on PyPI, even though the publish"
                      echo "step reported success (\`continue-on-error\` masks failures)."
                      echo
                      echo "As of 2026-08-07 the cause was that trusted publishing is not"
                      echo "configured for this repository (\`environment: MISSING\` in the OIDC"
                      echo "claim). **The package name is also unregistered**, and the docs"
                      echo "previously told users to \`pip install ironshell\` — anyone may"
                      echo "claim the name, and pip executes package code at install time."
                      echo "See finding 12 in \`docs/security/SECURITY_AUDIT_2026-07-30.md\`."
                    } | tee -a "$GITHUB_STEP_SUMMARY"
                  fi

    build-linux-packages:
        name: Linux Packages (.deb/.rpm)
        needs: [create-release, build-binaries]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2
              with:
                  key: linux-packages

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libasound2-dev libssl-dev pkg-config

            - name: Install packaging tools
              run: cargo install cargo-deb cargo-generate-rpm

            - name: Build release binary
              run: cargo build --release --features native

            - name: Build .deb package
              run: cargo deb --no-build

            - name: Build .rpm package
              run: cargo generate-rpm

            - name: Hand the packages to publish-release
              uses: actions/upload-artifact@v4
              with:
                  name: release-linux-packages
                  path: |
                      target/debian/*.deb
                      target/generate-rpm/*.rpm
                  if-no-files-found: error

    publish-release:
        # One release, created once, with every asset and the generated notes.
        #
        # The release used to be published first and each build attached its
        # file as it finished, so for the length of the builds -- and for good
        # when one failed -- the public release had some platforms' binaries
        # and not others. A draft is not the fix: a draft is not bound to its
        # tag, and the uploads then made a second release (see the 2026-08-07
        # history in git log). Now a failed build means no release: re-run the
        # failed job, and this one runs when every build has passed.
        name: Publish GitHub release
        needs: [create-release, build-binaries, build-wasm, build-linux-packages]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  pattern: release-*
                  path: dist
                  merge-multiple: true

            - name: List the assets
              run: ls -la dist && test "$(ls dist | wc -l)" -ge 9

            - name: Create the release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: v${{ needs.create-release.outputs.version }}
                  name: IronShell v${{ needs.create-release.outputs.version }}
                  draft: false
                  prerelease: false
                  generate_release_notes: true
                  fail_on_unmatched_files: true
                  files: dist/*
