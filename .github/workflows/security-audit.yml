name: Security Audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
      
      - uses: Swatinem/rust-cache@v2
      
      - name: Install and run cargo-audit
        # `|| true` used to swallow the result, so this job reported green
        # regardless. It was hiding two live findings: RUSTSEC-2026-0258 (h2,
        # unbounded empty DATA frames) reached the tree twice, and this repo
        # serves HTTP. Measured clean on 2026-08-18 after dropping the
        # vulnerable chain, so the gate can be real from here.
        #
        # Warnings (unsound / unmaintained) stay non-fatal: `cargo audit`
        # exits non-zero only for vulnerabilities, and there are 12 warnings
        # that are not ours to fix today.
        run: |
          cargo install cargo-audit --locked
          cargo audit --json > audit-report.json || true
          cargo audit
      
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-report
          path: audit-report.json
          retention-days: 30

  supply-chain:
    name: Supply Chain Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
      
      - uses: Swatinem/rust-cache@v2
      
      - name: Install and run cargo-deny
        run: |
          cargo install cargo-deny --locked
          test -f deny.toml || cargo deny init
          # Measured 2026-08-18: advisories ok, bans ok, licenses ok, sources ok.
          # Gated for the same reason as cargo-audit -- a check that cannot fail
          # is not a check.
          cargo deny check

  sbom-generation:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
      
      - uses: Swatinem/rust-cache@v2
      
      - name: Generate SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          # Emitting `{}` on failure published an empty SBOM as though it were
          # the real inventory -- an artifact that looks authoritative and lists
          # nothing. Fail instead; a missing SBOM is honest, a blank one is not.
          cargo cyclonedx --format json > sbom.json
      
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 30

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar xz
          # Deliberately still non-blocking, and this is the one that is not
          # a cop-out: gitleaks scans *git history*, which has never been
          # triaged here (there is a known pending history scrub). Gating it
          # before that triage would red the pipeline on historical findings
          # that cannot be fixed without a force-push. Findings go to the run
          # summary so they are visible rather than swallowed.
          ./gitleaks detect --source . --verbose --report-path gitleaks.json || true
          if [ -s gitleaks.json ] && [ "$(jq 'length' gitleaks.json 2>/dev/null || echo 0)" != "0" ]; then
            {
              echo "### ⚠️ gitleaks findings: $(jq 'length' gitleaks.json)"
              echo
              echo "Not gating the build -- git history has not been triaged."
              echo "Triage, scrub, then remove this exemption."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  outdated-dependencies:
    name: Check Outdated Dependencies
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - uses: dtolnay/rust-toolchain@stable
      
      - uses: Swatinem/rust-cache@v2
      
      - name: Check outdated
        run: |
          cargo install cargo-outdated --locked
          cargo outdated --root-deps-only || true

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [security-audit, supply-chain, sbom-generation, secret-scanning]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Summary
        run: |
          {
            echo "# Security Audit Results"
            echo "- Security Audit: ${{ needs.security-audit.result }}"
            echo "- Supply Chain: ${{ needs.supply-chain.result }}"
            echo "- SBOM: ${{ needs.sbom-generation.result }}"
            echo "- Secrets: ${{ needs.secret-scanning.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
