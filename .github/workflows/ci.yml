name: CI

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]
    # Manual re-run. Added 2026-08-06, during a GitHub Actions incident that
    # throttled webhook delivery: pushes landed but triggered no runs, and
    # without this the only way to get CI to run on an already-pushed commit
    # was an empty commit. Release and Security Audit already had it.
    workflow_dispatch:

env:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1

jobs:
    test:
        name: Test (${{ matrix.os }})
        timeout-minutes: 30
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2

            - name: Install Linux dependencies
              if: matrix.os == 'ubuntu-latest'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libasound2-dev libssl-dev pkg-config sqlite3

            # The db builtins shell out to the `sqlite3` CLI. Without it those
            # tests skip -- loudly, but they skip -- and the SQL-injection
            # regression tests are exactly the ones worth actually running.
            # They were silently not running on Windows until they were made to
            # skip rather than fail.
            # `choco install` exits 0 when the community feed is unavailable,
            # having installed nothing:
            #
            #   Failed to fetch results from V2 feed at '…Packages(Id='SQLite')'
            #   with following message : Response status code does not indicate
            #   success: 503 (Service Unavailable).
            #   Chocolatey installed 0/0 packages.
            #
            # The job then went red two steps later on "sqlite3 is not
            # recognized as a name of a cmdlet", which names the symptom and
            # not the cause. That happened on one run in eight (2026-09-17,
            # run 35165937172). Retry the transient failure, and fail *here*
            # with the real reason if it persists.
            - name: Install sqlite3 (Windows)
              if: matrix.os == 'windows-latest'
              shell: pwsh
              run: |
                  $env:PATH = "C:\ProgramData\chocolatey\bin;$env:PATH"
                  foreach ($attempt in 1..3) {
                      choco install sqlite -y --no-progress
                      if (Get-Command sqlite3 -ErrorAction SilentlyContinue) {
                          Write-Host "sqlite3 available after attempt $attempt"
                          exit 0
                      }
                      Write-Host "::warning::attempt $attempt installed nothing (feed unavailable?); retrying"
                      Start-Sleep -Seconds (10 * $attempt)
                  }
                  Write-Host "::error::sqlite3 could not be installed after 3 attempts. The Chocolatey community feed returns 503 intermittently; this is not a code failure."
                  exit 1

            # Kept as a hard gate rather than a skip: the db builtins shell out
            # to the `sqlite3` CLI, and the SQL-injection regression tests are
            # exactly the ones worth actually running.
            - name: Verify sqlite3 is on PATH
              run: sqlite3 --version

            - name: Run tests
              run: cargo test --workspace --features native

            - name: Run doc tests
              run: cargo test --doc

    lint:
        name: Lint
        timeout-minutes: 25
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy, rustfmt

            - uses: Swatinem/rust-cache@v2

            - name: Install Linux dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libasound2-dev libssl-dev pkg-config

            - name: Check formatting
              run: cargo fmt --all -- --check

            - name: Clippy
              run: cargo clippy --workspace --all-targets --features native -- -D warnings

    # `rust-version` in Cargo.toml is a promise to downstream users, and until
    # now nothing checked it: every job above pins `@stable`, so the crate was
    # only ever built on whatever stable happened to be. The claim was verified
    # by hand on 2026-09-22 and held -- but a claim nothing enforces is one
    # release away from being false, and the failure lands on a user who gets
    # a compile error instead of a clear "upgrade your toolchain".
    msrv:
        name: MSRV (rust-version in Cargo.toml)
        timeout-minutes: 25
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # Read the floor from Cargo.toml rather than repeating it here.
            # A hardcoded version drifts from the manifest silently, and then
            # this job passes while testing the wrong thing.
            - name: Read rust-version from Cargo.toml
              id: msrv
              run: |
                  V=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
                  if [ -z "$V" ]; then
                    echo 'no rust-version in Cargo.toml; nothing to enforce' >&2
                    exit 1
                  fi
                  echo "version=$V" >> "$GITHUB_OUTPUT"
                  echo "enforcing MSRV $V"

            - uses: dtolnay/rust-toolchain@master
              with:
                  toolchain: ${{ steps.msrv.outputs.version }}

            - uses: Swatinem/rust-cache@v2

            - name: Install Linux dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libasound2-dev libssl-dev pkg-config

            # `check`, not `test`: this asks whether the crate COMPILES on the
            # floor. Behaviour is covered by the test job on stable.
            - name: Check on the declared MSRV
              run: cargo check --workspace --features native

    # The catalogue probes, as gates. They were run by hand, which meant every
    # number in docs/TYPED_SHELL_RESPONSE.md was only as current as the last
    # time someone remembered to run them. Each probe already exits 2 when it
    # measured nothing (too few builtins enumerated, a stale binary), so a probe
    # that silently stops testing fails the job rather than passing it.
    #
    #   uncoded.mjs         every builtin, a nonsense argument: 0 uncoded, 0 hung
    #   uncoded-paths.mjs   every builtin, a missing path:      0 uncoded, 0 hung
    #   discarded-args.mjs  extra arguments ignored: may only fall (ratchets.json)
    #
    # silent-success.mjs is not here on purpose: it lists suspects, not defects,
    # and its strict half -- advice returned as a result -- is already a Rust
    # test.
    agentic-probes:
        name: Agentic probes
        timeout-minutes: 45
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2

            - name: Install Linux dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libasound2-dev libssl-dev pkg-config

            - uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Build ae
              run: cargo build --bin ae

            - name: Run the probes as gates
              env:
                  AE_PROBE_ASSERT: "1"
              run: |
                  export PATH="$GITHUB_WORKSPACE/target/debug:$PATH"
                  mkdir -p "$RUNNER_TEMP/probes" && cd "$RUNNER_TEMP/probes"
                  # Every probe runs even when an earlier one fails: the first
                  # CI failure of this job stopped at the uncoded probe and hid
                  # what the other two would have said.
                  status=0
                  node "$GITHUB_WORKSPACE/benches/agentic/uncoded.mjs" || status=1
                  node "$GITHUB_WORKSPACE/benches/agentic/uncoded-paths.mjs" || status=1
                  node "$GITHUB_WORKSPACE/benches/agentic/discarded-args.mjs" || status=1
                  exit $status

    vscode-extension:
        name: VS Code Extension
        timeout-minutes: 15
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: npm
                  cache-dependency-path: editors/vscode/package-lock.json

            - name: Install
              working-directory: editors/vscode
              run: npm ci

            # Compiles first (via pretest), then runs the grammar through the
            # same vscode-textmate/oniguruma pair VS Code uses, so a rule that
            # is unreachable in practice fails here rather than shipping.
            - name: Test
              working-directory: editors/vscode
              run: npm test

            # The manifest is a set of promises about files that must exist;
            # packaging is where a broken one surfaces.
            - name: Package
              working-directory: editors/vscode
              run: npx vsce package --no-dependencies --out /tmp/aethershell.vsix

    wasm:
        name: WASM Build
        timeout-minutes: 25
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown

            - uses: Swatinem/rust-cache@v2

            - name: Install wasm-pack
              run: cargo install wasm-pack

            - name: Build WASM
              run: |
                  cd web
                  wasm-pack build --target web --dev

            - name: Upload WASM artifact
              uses: actions/upload-artifact@v4
              with:
                  name: wasm-pkg
                  path: web/pkg/
                  retention-days: 7

    cla:
        name: CLA Check
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: CLA Assistant
              uses: contributor-assistant/github-action@v2.6.1
              with:
                  path-to-signatures: "signatures/cla.json"
                  path-to-document: "https://github.com/${{ github.repository }}/blob/master/CLA.md"
                  branch: "cla-signatures"
                  remote-organization-name: nervosys
                  remote-repository-name: AetherShell
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_TOKEN }}
    build:
        name: Build (${{ matrix.target }})
        timeout-minutes: 40
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: x86_64-unknown-linux-gnu
                      os: ubuntu-latest
                    - target: x86_64-apple-darwin
                      os: macos-latest
                    - target: aarch64-apple-darwin
                      os: macos-latest
                    - target: x86_64-pc-windows-msvc
                      os: windows-latest
        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - uses: Swatinem/rust-cache@v2
              with:
                  key: ${{ matrix.target }}

            - name: Install Linux dependencies
              if: matrix.os == 'ubuntu-latest'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libasound2-dev libssl-dev pkg-config

            - name: Build
              run: cargo build --release --target ${{ matrix.target }} --features native

            - name: Upload binary
              uses: actions/upload-artifact@v4
              with:
                  name: ae-${{ matrix.target }}
                  path: |
                      target/${{ matrix.target }}/release/ae
                      target/${{ matrix.target }}/release/ae.exe
                      target/${{ matrix.target }}/release/aimodel
                      target/${{ matrix.target }}/release/aimodel.exe
                  retention-days: 7
