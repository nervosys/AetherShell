name: CI

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]
    # Manual re-run. Added 2026-08-06, during a GitHub Actions incident that
    # throttled webhook delivery: pushes landed but triggered no runs, and
    # without this the only way to get CI to run on an already-pushed commit
    # was an empty commit. Release and Security Audit already had it.
    workflow_dispatch:

env:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1

jobs:
    test:
        name: Test (${{ matrix.os }})
        timeout-minutes: 30
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2

            - name: Install Linux dependencies
              if: matrix.os == 'ubuntu-latest'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libasound2-dev libssl-dev pkg-config sqlite3

            # The db builtins shell out to the `sqlite3` CLI. Without it those
            # tests skip -- loudly, but they skip -- and the SQL-injection
            # regression tests are exactly the ones worth actually running.
            # They were silently not running on Windows until they were made to
            # skip rather than fail.
            - name: Install sqlite3 (Windows)
              if: matrix.os == 'windows-latest'
              run: choco install sqlite -y --no-progress

            - name: Verify sqlite3 is on PATH
              run: sqlite3 --version

            - name: Run tests
              run: cargo test --workspace --features native

            - name: Run doc tests
              run: cargo test --doc

    lint:
        name: Lint
        timeout-minutes: 25
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy, rustfmt

            - uses: Swatinem/rust-cache@v2

            - name: Install Linux dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libasound2-dev libssl-dev pkg-config

            - name: Check formatting
              run: cargo fmt --all -- --check

            - name: Clippy
              run: cargo clippy --workspace --all-targets --features native -- -D warnings

    wasm:
        name: WASM Build
        timeout-minutes: 25
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown

            - uses: Swatinem/rust-cache@v2

            - name: Install wasm-pack
              run: cargo install wasm-pack

            - name: Build WASM
              run: |
                  cd web
                  wasm-pack build --target web --dev

            - name: Upload WASM artifact
              uses: actions/upload-artifact@v4
              with:
                  name: wasm-pkg
                  path: web/pkg/
                  retention-days: 7

    cla:
        name: CLA Check
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: CLA Assistant
              uses: contributor-assistant/github-action@v2.6.1
              with:
                  path-to-signatures: "signatures/cla.json"
                  path-to-document: "https://github.com/${{ github.repository }}/blob/master/CLA.md"
                  branch: "cla-signatures"
                  remote-organization-name: nervosys
                  remote-repository-name: AetherShell
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_TOKEN }}
    build:
        name: Build (${{ matrix.target }})
        timeout-minutes: 40
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: x86_64-unknown-linux-gnu
                      os: ubuntu-latest
                    - target: x86_64-apple-darwin
                      os: macos-latest
                    - target: aarch64-apple-darwin
                      os: macos-latest
                    - target: x86_64-pc-windows-msvc
                      os: windows-latest
        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - uses: Swatinem/rust-cache@v2
              with:
                  key: ${{ matrix.target }}

            - name: Install Linux dependencies
              if: matrix.os == 'ubuntu-latest'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libasound2-dev libssl-dev pkg-config

            - name: Build
              run: cargo build --release --target ${{ matrix.target }} --features native

            - name: Upload binary
              uses: actions/upload-artifact@v4
              with:
                  name: ae-${{ matrix.target }}
                  path: |
                      target/${{ matrix.target }}/release/ae
                      target/${{ matrix.target }}/release/ae.exe
                      target/${{ matrix.target }}/release/aimodel
                      target/${{ matrix.target }}/release/aimodel.exe
                  retention-days: 7
