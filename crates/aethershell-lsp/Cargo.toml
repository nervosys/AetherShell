[package]
name = "aethershell-lsp"
version = "1.4.0"
edition = "2021"
description = "Language Server Protocol implementation for AetherShell"
license = "AGPL-3.0-or-later"
authors = ["Nervosys"]
repository = "https://github.com/nervosys/AetherShell"

[[bin]]
name = "aethershell-lsp"
path = "src/main.rs"

[dependencies]
# LSP implementation
tower-lsp = "0.20"
tokio = { version = "1", features = ["full"] }

# Async runtime
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# AetherShell core - use native feature explicitly
aethershell = { version = "1.4.0", path = "../..", default-features = false, features = [
    "native",
] }

# Utilities
dashmap = "5.5"
ropey = "1.6"
lsp-types = "0.94"
url = "2.5"
regex = "1.10"
